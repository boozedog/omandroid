# SPDX-License-Identifier: MIT
# Device descriptor: Google Pixel Fold (felix), first light.
#
# Same rules as device/cheetah/device.conf. No shell.

# --- Identity ---
CODENAME=felix
NAME="Pixel Fold"
SOC=gs201
COMPATIBLE="google,gs201-felix"
# No userspace package yet. bin/omamobile skips the host tools until it exists.
PACKAGE=omamobile-device-felix

# --- Kernel and device tree ---
DTB=exynos/google/gs201-felix.dtb
# Built value first. The packer rewrites a second copy for the other id.
SOC_IDS="b0:0x9855001 a0:0x9855000"

# --- Bootloader glue ---
DTBO_SOURCE=felix-m1-overlay.dts
DTBO_BOARD_ID=0x30606
DTBO_BOARD_REV=0x10000
VENDOR_CMDLINE="console=tty0 earlycon=exynos4210,0x10A00000 clk_ignore_unused pd_ignore_unused printk.devkmsg=on bootconfig"
VENDOR_PAGESIZE=0x800
OS_VERSION=17.0.0
OS_PATCH_LEVEL=2026-10

# --- Storage guard ---
BOOT_IMAGES="boot init_boot vendor_boot vendor_kernel_boot dtbo"
UFS_RW="boot_b init_boot_b vendor_boot_b vendor_kernel_boot_b dtbo_b userdata"

# --- Initramfs ---
INITRAMFS_INIT=initramfs/init
# Cover panel, portrait. The first-light init does not draw a splash.
PANEL_SIZE=1080x2092
